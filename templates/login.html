{% extends "base.html" %}
{% block title %}Login — Desertuna{% endblock %}
{% block head %}
<style>
.login-container {
  max-width: 420px;
  margin: 3rem auto;
  animation: fadeIn 0.3s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-card {
  padding: 2.5rem;
  text-align: center;
  border: 2px solid var(--accent);
  background: var(--accent-dim);
  border-radius: 14px;
}

.login-card img {
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.1));
}

.login-subtitle {
  color: var(--text2);
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.login-form label {
  text-align: left;
  font-weight: 700;
  font-size: 14px;
}

.login-form input {
  margin-bottom: 1.5rem;
  padding: 12px 14px;
  font-weight: 500;
}

.login-btn {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.login-footer {
  margin-top: 1.5rem;
  font-size: 12px;
  color: var(--text2);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
}

.login-footer p {
  margin: 0.5rem 0;
  font-weight: 500;
}
</style>
{% endblock %}
{% block content %}
<div class="login-container">
  <div class="card login-card">
    <!-- Official Desertuna Logo -->
    <img src="{{ url_for('static', filename='images/desertuna-brasao.png') }}" alt="Desertuna Logo" 
         style="height:90px; width:90px; margin-bottom:1.5rem; display:block; margin-left:auto; margin-right:auto; border-radius:8px; background:var(--accent-light); padding:4px;">
    
    <!-- Desertuna Text Logo -->
    <img src="{{ url_for('static', filename='images/desertuna-letras.png') }}" alt="Desertuna" 
         style="height:55px; margin-bottom:1rem; display:block; margin-left:auto; margin-right:auto;">
    
    <p class="login-subtitle">Disponibilidades & Presenças</p>
    
    <form method="post" class="login-form">
      <label for="password">🔐 Password</label>
      <input 
        type="password" 
        id="password"
        name="password" 
        placeholder="Insere a password" 
        autofocus
        required
        autocomplete="current-password"
      >
      <button type="submit" class="btn btn-primary login-btn">
        Entrar
      </button>
    </form>
    
    <div class="login-footer">
      <p style="font-size:13px; font-weight:600">🔒 Login seguro com password</p>
      <p style="font-size:11px; color:var(--text3)">Organizador Desertuna — Banda de Tunas</p>
    </div>
  </div>
</div>
{% endblock %}
