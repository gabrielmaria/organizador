{% extends "base.html" %}
{% block title %}Novo Evento — Tuna{% endblock %}
{% block content %}
<div class="row" style="margin-bottom:1.5rem">
  <h1 class="page-title" style="margin-bottom:0">Novo evento</h1>
</div>
<div class="card">
  <form method="post">
    <div style="margin-bottom:1rem">
      <label>Nome do evento</label>
      <input type="text" name="nome" placeholder="Ex: 14/JUN — Festas de Santo António">
      <div style="font-size:11px;color:var(--text3);margin-top:.3rem">
        💡 Inclui a data no nome (ex: <strong style="color:var(--text2)">27/MAR</strong>) para ordenação automática.
      </div>
    </div>
    <div style="margin-bottom:1.25rem">
      <label>Opções de resposta <span style="font-weight:400;text-transform:none;letter-spacing:0">(uma por linha)</span></label>
      <textarea name="opcoes" placeholder="Sim&#10;Não&#10;Levo Carro"></textarea>
    </div>
    <div style="display:flex;gap:.5rem">
      <button class="btn btn-primary">Criar evento</button>
      <a href="{{ url_for('index') }}" class="btn">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
