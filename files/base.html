<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tuna{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset ──────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}

/* ── Design tokens ──────────────────────────────────────────────────────────── */
:root{
  /* Base */
  --bg:        #0f0f11;
  --bg2:       #17171b;
  --bg3:       #1e1e24;
  --card:      #1a1a20;
  --card2:     #222229;
  --border:    rgba(255,255,255,.08);
  --border2:   rgba(255,255,255,.14);

  /* Text */
  --text:      #f0eff4;
  --text2:     #9896a4;
  --text3:     #5a5864;

  /* Accent — warm gold */
  --accent:        #e8b84b;
  --accent-dim:    rgba(232,184,75,.15);
  --accent-border: rgba(232,184,75,.3);

  /* Status */
  --green:        #4ade80;
  --green-bg:     rgba(74,222,128,.1);
  --green-border: rgba(74,222,128,.3);

  --red:        #f87171;
  --red-bg:     rgba(248,113,113,.1);
  --red-border: rgba(248,113,113,.3);

  --amber:        #fbbf24;
  --amber-bg:     rgba(251,191,36,.1);
  --amber-border: rgba(251,191,36,.3);

  --blue:        #60a5fa;
  --blue-bg:     rgba(96,165,250,.1);
  --blue-border: rgba(96,165,250,.3);

  /* Radii */
  --r:    10px;
  --r-lg: 16px;
  --r-xl: 20px;

  /* Nav */
  --nav-h: 56px;
  --bot-h: 64px;
}

/* ── Base ───────────────────────────────────────────────────────────────────── */
html { scroll-behavior:smooth }
body {
  font-family:'DM Sans', system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a { color:var(--accent); text-decoration:none }

/* ── Top nav ────────────────────────────────────────────────────────────────── */
.topnav {
  background:rgba(15,15,17,.9);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  height:var(--nav-h);
  display:flex;
  align-items:center;
  padding:0 1.25rem;
  position:sticky;
  top:0;
  z-index:200;
}
.brand {
  font-family:'DM Serif Display', serif;
  font-size:20px;
  color:var(--text);
  letter-spacing:-.3px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-right:auto;
}
.brand-dot {
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  display:inline-block;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(.8)}
}
/* Desktop nav links — hidden on mobile */
.nav-links {
  display:flex;gap:.25rem;
}
.nav-link {
  font-size:13px;font-weight:500;
  color:var(--text2);
  padding:6px 12px;
  border-radius:8px;
  transition:.15s;
  white-space:nowrap;
}
.nav-link:hover { background:var(--bg3);color:var(--text) }
.nav-link.active { color:var(--accent) }

/* ── Bottom nav (mobile) ────────────────────────────────────────────────────── */
.botnav {
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  height:var(--bot-h);
  background:rgba(15,15,17,.95);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  z-index:200;
  padding:0 .5rem;
  padding-bottom:env(safe-area-inset-bottom);
}
.botnav-inner {
  display:flex;
  height:100%;
  align-items:stretch;
}
.botnav-item {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:var(--text3);
  font-size:10px;
  font-weight:500;
  letter-spacing:.3px;
  text-transform:uppercase;
  transition:.15s;
  -webkit-tap-highlight-color:transparent;
  border-radius:10px;
  padding:.3rem .2rem;
}
.botnav-item:hover,.botnav-item.active { color:var(--accent) }
.botnav-icon { font-size:19px;line-height:1 }

/* ── Layout ─────────────────────────────────────────────────────────────────── */
.container {
  max-width:660px;
  margin:0 auto;
  padding:1.5rem 1rem 2rem;
}

/* ── Page title ─────────────────────────────────────────────────────────────── */
.page-title {
  font-family:'DM Serif Display', serif;
  font-size:26px;
  color:var(--text);
  letter-spacing:-.4px;
  margin-bottom:1.25rem;
}

/* ── Cards ──────────────────────────────────────────────────────────────────── */
.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:1.25rem;
  margin-bottom:.75rem;
}
.card-sm { padding:.75rem }
.card-title {
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.6px;
  color:var(--text3);
  margin-bottom:.875rem;
}

/* ── Section label ──────────────────────────────────────────────────────────── */
.section-label {
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.7px;
  color:var(--text3);
  margin-bottom:.4rem;
  padding:0 .25rem;
}

/* ── Forms ──────────────────────────────────────────────────────────────────── */
label {
  font-size:12px;
  font-weight:500;
  color:var(--text2);
  display:block;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:.4px;
}
input[type=text],
input[type=password],
input[type=date],
input[type=time],
textarea,
select {
  width:100%;
  padding:10px 14px;
  border:1px solid var(--border2);
  border-radius:var(--r);
  font-size:14px;
  font-family:'DM Sans',sans-serif;
  background:var(--bg3);
  color:var(--text);
  -webkit-appearance:none;
  transition:.15s;
}
input:focus,textarea:focus,select:focus {
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
}
textarea { min-height:100px;resize:vertical }
select option { background:var(--bg3) }

/* ── Buttons ────────────────────────────────────────────────────────────────── */
.btn {
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 18px;
  border-radius:var(--r);
  font-size:14px;font-weight:500;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  border:1px solid var(--border2);
  background:var(--card2);
  color:var(--text);
  transition:.15s;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover { background:var(--bg3);border-color:var(--border2) }
.btn:active { transform:scale(.97) }

.btn-primary {
  background:var(--accent);
  color:#0f0f11;
  border-color:var(--accent);
  font-weight:600;
}
.btn-primary:hover { background:#f0c55a;border-color:#f0c55a }

.btn-danger { color:var(--red);border-color:var(--red-border) }
.btn-danger:hover { background:var(--red-bg) }

.btn-sm { padding:5px 12px;font-size:12px;border-radius:8px }
.btn-full { width:100% }

/* ── Badges ─────────────────────────────────────────────────────────────────── */
.badge {
  display:inline-flex;align-items:center;
  padding:3px 9px;
  border-radius:20px;
  font-size:12px;font-weight:600;
  letter-spacing:.2px;
}
.badge-sim,.badge-ahoras  { background:var(--green-bg);color:var(--green);border:1px solid var(--green-border) }
.badge-nao,.badge-naoveio { background:var(--red-bg);color:var(--red);border:1px solid var(--red-border) }
.badge-talvez,.badge-atrasado { background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border) }
.badge-none,.badge-semregisto { background:var(--bg3);color:var(--text3);border:1px solid var(--border) }
.badge-levocarro { background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border) }

/* ── Flash messages ─────────────────────────────────────────────────────────── */
.flash {
  background:var(--amber-bg);
  border:1px solid var(--amber-border);
  border-radius:var(--r);
  padding:10px 14px;
  margin-bottom:1rem;
  font-size:13px;
  color:var(--amber);
}

/* ── Utility ────────────────────────────────────────────────────────────────── */
.row   { display:flex;gap:.75rem;align-items:center;flex-wrap:wrap }
.spacer{ flex:1 }
.muted { color:var(--text2);font-size:13px }
.divider { border:none;border-top:1px solid var(--border);margin:1rem 0 }

/* ── Divider with label ──────────────────────────────────────────────────────  */
.divider-label {
  display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;
}
.divider-label::before,.divider-label::after {
  content:'';flex:1;height:1px;background:var(--border);
}
.divider-label span {
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.6px;color:var(--text3);
}

/* ── Scrollbar ───────────────────────────────────────────────────────────────  */
::-webkit-scrollbar { width:6px;height:6px }
::-webkit-scrollbar-track { background:transparent }
::-webkit-scrollbar-thumb { background:var(--border2);border-radius:3px }

/* ── Responsive ─────────────────────────────────────────────────────────────── */
@media (max-width:640px) {
  .nav-links { display:none }
  .botnav    { display:block }
  .container { padding-bottom:calc(var(--bot-h) + 1rem) }
}
</style>
{% block head %}{% endblock %}
</head>
<body>

{% if session.auth %}
<!-- Top nav -->
<nav class="topnav">
  <span class="brand">
    <span class="brand-dot"></span>
    Tuna
  </span>
  <div class="nav-links">
    <a href="{{ url_for('index') }}"      class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Eventos</a>
    <a href="{{ url_for('ensaios') }}"    class="nav-link {% if request.endpoint == 'ensaios' or request.endpoint == 'ensaio_detail' %}active{% endif %}">Ensaios</a>
    <a href="{{ url_for('elementos') }}"  class="nav-link {% if request.endpoint == 'elementos' %}active{% endif %}">Membros</a>
    <a href="{{ url_for('estatisticas') }}" class="nav-link {% if 'estatistica' in request.endpoint %}active{% endif %}">Stats</a>
    <a href="{{ url_for('backup_pagina') }}" class="nav-link {% if request.endpoint == 'backup_pagina' %}active{% endif %}">Backup</a>
    <a href="{{ url_for('logout') }}"     class="nav-link">Sair</a>
  </div>
</nav>

<!-- Bottom nav (mobile) -->
<nav class="botnav">
  <div class="botnav-inner">
    <a href="{{ url_for('index') }}" class="botnav-item {% if request.endpoint == 'index' %}active{% endif %}">
      <span class="botnav-icon">🎵</span>
      <span>Eventos</span>
    </a>
    <a href="{{ url_for('ensaios') }}" class="botnav-item {% if 'ensaio' in request.endpoint %}active{% endif %}">
      <span class="botnav-icon">🎼</span>
      <span>Ensaios</span>
    </a>
    <a href="{{ url_for('elementos') }}" class="botnav-item {% if request.endpoint == 'elementos' %}active{% endif %}">
      <span class="botnav-icon">👥</span>
      <span>Membros</span>
    </a>
    <a href="{{ url_for('estatisticas') }}" class="botnav-item {% if 'estatistica' in request.endpoint %}active{% endif %}">
      <span class="botnav-icon">📊</span>
      <span>Stats</span>
    </a>
    <a href="{{ url_for('backup_pagina') }}" class="botnav-item {% if request.endpoint == 'backup_pagina' %}active{% endif %}">
      <span class="botnav-icon">💾</span>
      <span>Backup</span>
    </a>
  </div>
</nav>
{% endif %}

<div class="container">
  {% for msg in get_flashed_messages() %}
  <div class="flash">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
